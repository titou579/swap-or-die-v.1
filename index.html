<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWAP OR DIE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d11;
            color: #ffffff;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Overlay Interface Utilisateur */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Modale de connexion / Lobby */
        #login-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 229, 255, 0.2);
        }

        #login-screen h1 {
            font-size: 2.2rem;
            letter-spacing: 3px;
            margin-bottom: 25px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00e5ff, #7b2cbf);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 229, 255, 0.4);
        }

        #error-msg {
            color: #ff3366;
            font-size: 0.85rem;
            margin-top: 15px;
            min-height: 20px;
        }

        /* HUD en jeu */
        #hud {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-card {
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
        }

        #room-info {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00e5ff;
        }

        #player-list {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        /* Notification de Swap */
        #swap-notice {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 51, 102, 0.9);
            color: #fff;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.8);
        }

        #swap-notice.active {
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <canvas id="game-canvas"></canvas>

    <div id="ui-overlay">
        <!-- Ecran de Connexion -->
        <div id="login-screen" class="interactive">
            <h1>SWAP OR DIE</h1>
            <div class="input-group">
                <label for="playerName">Pseudo</label>
                <input type="text" id="playerName" placeholder="Entre ton pseudo" maxlength="15" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="roomCode">Code de la Room</label>
                <input type="text" id="roomCode" placeholder="Ex: ROOM1" maxlength="10" autocomplete="off">
            </div>
            <button id="joinBtn" class="btn-main">REJOINDRIE LA PARTIE</button>
            <div id="error-msg"></div>
        </div>

        <!-- HUD In-Game -->
        <div id="hud">
            <div class="hud-card">
                <div id="room-info">ROOM: <span id="display-room-code">-</span></div>
                <div id="player-list">Joueurs connectés: <span id="display-player-count">0</span></div>
            </div>
        </div>

        <!-- Notification de Swap -->
        <div id="swap-notice">SWAP !</div>
    </div>

    <!-- Librairies Réseau et 3D -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
